    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        margin: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
      }
      .font-outfit {
        font-family: 'Outfit', sans-serif;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }
      .animate-shake {
        animation: shake 0.2s ease-in-out 0s 2;
      }
      @keyframes success-pop {
        0% { transform: scale(1); filter: brightness(1); }
        30% { transform: scale(1.2); filter: brightness(1.4); }
        50% { transform: scale(0.9); }
        70% { transform: scale(1.05); }
        100% { transform: scale(1); filter: brightness(1); }
      }
      .animate-success-pop {
        animation: success-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes success-glow {
        0% { box-shadow: 0 0 20px rgba(16, 185, 129, 0); border-color: rgba(16, 185, 129, 0.5); }
        50% { box-shadow: 0 0 80px rgba(16, 185, 129, 0.6); border-color: rgba(16, 185, 129, 1); }
        100% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); }
      }
      .animate-success-glow {
        animation: success-glow 0.8s ease-in-out infinite;
      }
      @keyframes confetti-burst {
        0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tw-x)), calc(-50% + var(--tw-y))) scale(1) rotate(var(--tw-rotate)); opacity: 0; }
      }
      .confetti-piece {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        pointer-events: none;
        z-index: 50;
        animation: confetti-burst 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }
      @keyframes tile-reveal {
        0% { opacity: 0; transform: translateY(15px) scale(0.85); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-tile-reveal {
        animation: tile-reveal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
      }
    </style>
